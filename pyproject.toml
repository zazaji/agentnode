[project]
name = "agentnode"
version = "3.3.0"
description = "Cross-platform MCP/REST computer-use agent runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "psutil>=6", "httpx>=0.27", "PyYAML>=6"
]
[project.optional-dependencies]
windows = ["pywin32>=306; platform_system=='Windows'", "pywinauto>=0.6.9; platform_system=='Windows'", "mss>=9", "Pillow>=10"]
linux = ["mss>=9", "Pillow>=10"]
macos = ["mss>=9", "Pillow>=10"]
ocr = ["rapidocr-onnxruntime>=1.3", "onnxruntime>=1.17"]
documents = ["pypdf>=5", "openpyxl>=3.1", "python-docx>=1.1", "Pillow>=10"]
browser = ["websocket-client>=1.8"]
office = ["pywin32>=306; platform_system=='Windows'"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
[project.scripts]
agentnode = "agentnode.__main__:main"
[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
addopts="-q"
